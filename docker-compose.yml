services:
  postgres:
    image: postgres:16-alpine
    container_name: lsoul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lsoul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lsoul_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lsoul}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lsoul_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-lsoul} -d ${POSTGRES_DB:-lsoul}"]
      interval: 3s
      timeout: 3s
      retries: 30

  db-init:
    build:
      context: .
      args:
        NEXT_PUBLIC_BANK_ID: ${NEXT_PUBLIC_BANK_ID:-MB}
        NEXT_PUBLIC_BANK_ACCOUNT: ${NEXT_PUBLIC_BANK_ACCOUNT:-0123456789}
        NEXT_PUBLIC_BANK_ACCOUNT_NAME: ${NEXT_PUBLIC_BANK_ACCOUNT_NAME:-LSOUL}
    image: lsoul-web:local
    container_name: lsoul-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lsoul}:${POSTGRES_PASSWORD:-lsoul_dev}@postgres:5432/${POSTGRES_DB:-lsoul}?schema=public
    command: ["npm", "run", "db:docker:init"]

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_BANK_ID: ${NEXT_PUBLIC_BANK_ID:-MB}
        NEXT_PUBLIC_BANK_ACCOUNT: ${NEXT_PUBLIC_BANK_ACCOUNT:-0123456789}
        NEXT_PUBLIC_BANK_ACCOUNT_NAME: ${NEXT_PUBLIC_BANK_ACCOUNT_NAME:-LSOUL}
    image: lsoul-web:local
    container_name: lsoul-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      APP_ROLE: storefront
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-lsoul}:${POSTGRES_PASSWORD:-lsoul_dev}@postgres:5432/${POSTGRES_DB:-lsoul}?schema=public
      NEXT_PUBLIC_STORE_URL: http://localhost:${APP_PORT:-3000}
      NEXT_PUBLIC_ADMIN_URL: http://localhost:${ADMIN_PORT:-3001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FASHN_API_KEY: ${FASHN_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      NEXT_PUBLIC_BANK_ID: ${NEXT_PUBLIC_BANK_ID:-MB}
      NEXT_PUBLIC_BANK_ACCOUNT: ${NEXT_PUBLIC_BANK_ACCOUNT:-0123456789}
      NEXT_PUBLIC_BANK_ACCOUNT_NAME: ${NEXT_PUBLIC_BANK_ACCOUNT_NAME:-LSOUL}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      # Đặt 1 để API quên mật khẩu trả link reset khi chưa có dịch vụ gửi email (demo/đồ án).
      PASSWORD_RESET_EXPOSE_LINK: ${PASSWORD_RESET_EXPOSE_LINK:-0}
      # Ghi đè model Gemini nếu cần (mặc định gemini-flash-latest).
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Độ phân giải ảnh thử đồ AI: 1K / 2K / 4K (mặc định 2K cho ảnh nét).
      TRYON_IMAGE_SIZE: ${TRYON_IMAGE_SIZE:-2K}
      # Siêu phân giải ảnh kết quả thử đồ: 2 / 4 / off (mặc định 2).
      TRYON_UPSCALE: ${TRYON_UPSCALE:-2}
      TRYON_UPSCALE_SPACE: ${TRYON_UPSCALE_SPACE:-Nick088/Real-ESRGAN_Pytorch}
    ports:
      - "${APP_PORT:-3000}:3000"
    command: ["npm", "start"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  admin:
    image: lsoul-web:local
    container_name: lsoul-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      web:
        condition: service_started
    environment:
      NODE_ENV: production
      APP_ROLE: admin
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-lsoul}:${POSTGRES_PASSWORD:-lsoul_dev}@postgres:5432/${POSTGRES_DB:-lsoul}?schema=public
      NEXT_PUBLIC_STORE_URL: http://localhost:${APP_PORT:-3000}
      NEXT_PUBLIC_ADMIN_URL: http://localhost:${ADMIN_PORT:-3001}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FASHN_API_KEY: ${FASHN_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      NEXT_PUBLIC_BANK_ID: ${NEXT_PUBLIC_BANK_ID:-MB}
      NEXT_PUBLIC_BANK_ACCOUNT: ${NEXT_PUBLIC_BANK_ACCOUNT:-0123456789}
      NEXT_PUBLIC_BANK_ACCOUNT_NAME: ${NEXT_PUBLIC_BANK_ACCOUNT_NAME:-LSOUL}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      # Đặt 1 để API quên mật khẩu trả link reset khi chưa có dịch vụ gửi email (demo/đồ án).
      PASSWORD_RESET_EXPOSE_LINK: ${PASSWORD_RESET_EXPOSE_LINK:-0}
      # Ghi đè model Gemini nếu cần (mặc định gemini-flash-latest).
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    command: ["npm", "run", "start:admin"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/admin').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  lsoul_postgres_data:
