services:
  postgres:
    image: postgres:16-alpine
    container_name: elane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: elane
      POSTGRES_PASSWORD: elane_dev
      POSTGRES_DB: elane
    ports:
      - "5432:5432"
    volumes:
      - elane_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elane -d elane"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  elane_postgres_data:
