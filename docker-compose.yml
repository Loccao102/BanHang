services:
  postgres:
    image: postgres:16-alpine
    container_name: lsoul-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lsoul
      POSTGRES_PASSWORD: lsoul_dev
      POSTGRES_DB: lsoul
    ports:
      - "5432:5432"
    volumes:
      - lsoul_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsoul -d lsoul"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  lsoul_postgres_data:
