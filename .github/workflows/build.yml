name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://elane:elane_ci@localhost:5432/elane_test?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elane
          POSTGRES_PASSWORD: elane_ci
          POSTGRES_DB: elane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elane -d elane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run build
