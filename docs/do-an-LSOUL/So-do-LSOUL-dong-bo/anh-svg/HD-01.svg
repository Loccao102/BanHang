 rx="6" /><text x="110.0" y="468.5" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="110.0" dy="0">Báo lỗi; yêu cầu</tspan><tspan x="110.0" dy="16">cập nhật thông tin</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="330" y="445" width="240" height="80" rx="6" /><text x="450.0" y="481.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="450.0" dy="0">Trong một giao dịch:</tspan><tspan x="450.0" dy="16">đọc giá, trừ tồn và tạo đơn</tspan></text><polygon stroke="black" stroke-width=".75" fill="white" points="450.0,575 535,620.0 450.0,665 365,620.0" /><text x="450.0" y="624.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="450.0" dy="0">Thanh toán QR?</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="100" y="725" width="200" height="65" rx="6" /><text x="200.0" y="761.5" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="200.0" dy="0">Ghi chờ thu tiền COD</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="570" y="725" width="210" height="65" rx="6" /><text x="675.0" y="753.5" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="675.0" dy="0">Hiển thị QR;</tspan><tspan x="675.0" dy="16">chờ thông báo giao dịch</tspan></text><polygon stroke="black" stroke-width=".75" fill="white" points="675.0,865 760,910.0 675.0,955 590,910.0" /><text x="675.0" y="914.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="675.0" dy="0">Giao dịch khớp?</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="335" y="1010" width="220" height="65" rx