yline stroke="black" stroke-width=".75" fill="none" points="436,727 600,727" marker-end="url(#filled)" /><rect x="438" y="689" width="160" height="36" fill="white" /><text x="518.0" y="703.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="518.0" dy="0">11. Đọc điều kiện mã giảm</tspan><tspan x="518.0" dy="16">giá</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="600,761 436,761" marker-end="url(#open)" /><rect x="438" y="739" width="160" height="20" fill="white" /><text x="518.0" y="753.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="518.0" dy="0">12. Thông tin mã</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="428,811 264,811" marker-end="url(#open)" /><rect x="266" y="773" width="160" height="36" fill="white" /><text x="346.0" y="787.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="346.0" dy="0">13. Trả mức giảm hoặc lý</tspan><tspan x="346.0" dy="16">do từ chối</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" points="264,902 309,902 309,924 264,924" marker-end="url(#filled)" /><rect x="269" y="864" width="150" height="36" fill="white" /><text x="274" y="878.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="274" dy="0">14. Điều hướng đến chức</tspan><tspan x="274" dy="16">năng tương ứng</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="256,974 92,974" marker-end="url(#open)" /><rect x="94" y="952" width="160" height="20" fill="white" /><text x="174.0" y="966.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="norma