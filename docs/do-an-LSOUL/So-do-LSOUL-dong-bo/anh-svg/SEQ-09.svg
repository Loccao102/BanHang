 text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="346.0" dy="0">6. Xác nhận đồng bộ</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" points="92,454 256,454" marker-end="url(#filled)" /><rect x="94" y="416" width="160" height="36" fill="white" /><text x="174.0" y="430.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="174.0" dy="0">7. Đổi số lượng hoặc xóa</tspan><tspan x="174.0" dy="16">sản phẩm</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" points="264,504 309,504 309,526 264,526" marker-end="url(#filled)" /><rect x="269" y="466" width="150" height="36" fill="white" /><text x="274" y="480.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="274" dy="0">8. Cập nhật giỏ và tạm</tspan><tspan x="274" dy="16">tính</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" points="92,562 256,562" marker-end="url(#filled)" /><rect x="94" y="540" width="160" height="20" fill="white" /><text x="174.0" y="554.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="174.0" dy="0">9. Nhập mã giảm giá</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" points="264,596 428,596" marker-end="url(#filled)" /><rect x="266" y="574" width="160" height="20" fill="white" /><text x="346.0" y="588.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="346.0" dy="0">10. Yêu cầu kiểm tra mã</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" points="436,646 600,646" marker-end="url(#filled)" /><rect x="438" y="608" width="160" height="36" fill="white" /><text x="518.0" y="622.0" text-anchor="middle" font-family="