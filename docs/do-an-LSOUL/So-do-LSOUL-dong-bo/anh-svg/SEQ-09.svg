13" font-weight="bold" font-style="normal" fill="black"><tspan x="28" dy="0">opt</tspan></text><rect x="81" y="229" width="579" height="24" fill="white" /><text x="86" y="245.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="86" dy="0">[Khách hàng đã đăng nhập]</tspan></text><ellipse stroke="black" stroke-width=".75" fill="white" cx="88.0" cy="17.0" rx="7.0" ry="7.0" /><polyline stroke="black" stroke-width=".75" fill="none" points="88.0,24 88.0,49" /><polyline stroke="black" stroke-width=".75" fill="none" points="73.0,34 103.0,34" /><polyline stroke="black" stroke-width=".75" fill="none" points="88.0,49 73.0,66" /><polyline stroke="black" stroke-width=".75" fill="none" points="88.0,49 103.0,66" /><text x="88.0" y="91.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="88.0" dy="0">Người dùng</tspan></text><ellipse stroke="black" stroke-width=".75" fill="white" cx="260.0" cy="32.0" rx="18.0" ry="18.0" /><polyline stroke="black" stroke-width=".75" fill="none" points="232.0,20 232.0,44" /><polyline stroke="black" stroke-width=".75" fill="none" points="232.0,32 242.0,32" /><text x="260.0" y="85.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="260.0" dy="0">Form giỏ hàng</tspan></text><ellipse stroke="black" stroke-width=".75" fill="white" cx="432.0" cy="32.0" rx="18.0" ry="18.0" /><polyline stroke="black" stroke-width=".75" fill="none" points="438.0,8 430.0,14 439.0,18" /><text x="432.0" y="85.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="432.0" dy="0">Xử lý giỏ và ưu đãi</tspan></text><ellipse stroke="black" stroke-width=".75" fill="white" cx="604.0" cy="32.0" rx="18.0" ry="18.0" /><polyline stroke="black" stroke-width=".75" fill="none" poin