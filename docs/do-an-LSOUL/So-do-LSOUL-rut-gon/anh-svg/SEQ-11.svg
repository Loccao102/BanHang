-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">1. Yêu cầu thông tin thanh toán</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="205.0,90 346.0,90" marker-end="url(#filled)" /><rect x="18" y="95" width="664" height="18" fill="white" /><text x="23" y="108.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">2. Kiểm tra chủ đơn và đọc trạng thái</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,117 644.0,117" marker-end="url(#filled)" /><rect x="18" y="122" width="664" height="18" fill="white" /><text x="23" y="135.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">3. Trả mã QR và nội dung chuyển khoản</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="346.0,144 205.0,144" marker-end="url(#open)" /><rect x="18" y="149" width="664" height="18" fill="white" /><text x="23" y="162.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">4. Chuyển khoản theo thông tin đơn</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="56.0,171 495.0,171" marker-end="url(#filled)" /><rect x="18" y="176" width="664" height="18" fill="white" /><text x="23" y="189.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">5. Gửi thông báo giao dịch</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="495.0,198 354.0,198" marker-end="url(#filled)" /><rect x="18" y="203" width="664" height="18" fill="white" /><text x="23" y="216.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">6. Kiểm tra chữ ký; từ chối chữ ký sai</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,225 384.0,225 384.0,237 355.0,237" marker-end="url(#filled)" /><rect x="18" y="230" width="664" height="18" fill="white" /><text x="23" y="243.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">7. Kiểm tra mã giao dịch, mã đơn và số tiền</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,252 644.0,252" marker-end="url(#filled)" /><rect x="18" y="257" width="664" height="18" fill="white" /><text x="23" y="270.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">8. Ghi giao dịch mới khớp và xác nhận đã trả</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,279 644.0,279" marker-end="url(#filled)" /><rect x="18" y="284" width="664" height="18" fill="white" /><text x="23" y="297.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">9. Không thu tiền lặp; giữ đơn khi chưa khớp</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,306 384.0,306 384.0,318 355.0,318" marker-end="url(#filled)" /><rect x="18" y="311" width="664" height="18" fill="white" /><text x="23" y="324.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">10. Xác nhận tiếp nhận thông báo hợp lệ</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="354.0,333 495.0,333" marker-end="url(#open)" /><rect x="18" y="338" width="664" height="18" fill="white" /><text x="23" y="351.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">11. Lấy trạng thái thanh toán mới</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="205.0,360 346.0,360" marker-end="url(#filled)" /><rect x="18" y="365" width="664" height="18" fill="white" /><text x="23" y="378.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">12. Trả kết quả thanh toán</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="346.0,387 205.0,387" marker-end="url(#open)" /><rect x="18" y="392" width="664" height="18" fill="white" /><text x="23" y="405.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">13. Hiển thị trạng thái đơn</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="197.0,414 56.0,414" marker-end="url(#open)" /><ellipse stroke="black" stroke-width="1.0" fill="white" cx="52.0" cy="10.0" rx="7.0" ry="7.0" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,17 52.0,33" /><polyline stroke="black" stroke-width="1.0" fill="none" points="42.0,22 62.0,22" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 43.0,43" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 61.0,43" /><text x="52.0" y="52.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="52.0" dy="0">Khách hàng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="153.0" y="5" width="96" height="42" /><text x="201.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="201.0" dy="0">Form thanh toán</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="302.0" y="5" width="96" hei