<svg xmlns="http://www.w3.org/2000/svg" width="440" height="265" viewBox="0 0 440 265"><title>Phản hồi gợi ý trong hội thoại</title><rect width="100%" height="100%" fill="white" /><defs><marker id="filled" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black" stroke="black" stroke-width="1.0" /></marker><marker id="open" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="black" stroke-width="1.0" /></marker><marker id="triangle" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="white" stroke="black" stroke-width="1.0" /></marker></defs><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="55.0,55 55.0,257" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="165.0,55 165.0,257" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="275.0,55 275.0,257" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="385.0,55 385.0,257" /><rect stroke="black" stroke-width="1.0" fill="white" x="271.0" y="116" width="8" height="113" /><rect stroke="black" stroke-width="1.0" fill="white" x="161.0" y="89" width="8" height="167" /><rect stroke="black" stroke-width="1.0" fill="white" x="381.0" y="170" width="8" height="85" /><rect x="18" y="68" width="404" height="18" fill="white" /><text x="23" y="81.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">1. Đánh dấu gợi ý hữu ích hoặc chưa phù hợp</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="59.0,90 161.0,90" marker-end="url(#filled)" /><rect x="18" y="95" width="404" height="18" fill="white" /><text x="23" y="108.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">2. Gửi nội dung phản hồi</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="169.0,117 271.0,117" marker-end="url(#filled)" /><rect x="18" y="122" width="404" height="18" fill="white" /><text x="23" y="135.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">3. Kiểm tra phản hồi và trạng thái đăng nhập</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="279.0,144 309.0,144 309.0,156 280.0,156" marker-end="url(#filled)" /><rect x="18" y="149" width="404" height="18" fill="white" /><text x="23" y="162.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">4. Lưu phản hồi của tài khoản nếu đủ điều kiện</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="279.0,171 381.0,171" marker-end="url(#filled)" /><rect x="18" y="176" width="404" height="18" fill="white" /><text x="23" y="189.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">5. Cập nhật sự kiện và hồ sơ sở thích</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="279.0,198 381.0,198" marker-end="url(#filled)" /><rect x="18" y="203" width="404" height="18" fill="white" /><text x="23" y="216.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">6. Xác nhận phản hồi có được lưu hay không</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="271.0,225 169.0,225" marker-end="url(#open)" /><rect x="18" y="230" width="404" height="18" fill="white" /><text x="23" y="243.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">7. Hiển thị thông báo ghi nhận</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="161.0,252 59.0,252" marker-end="url(#open)" /><ellipse stroke="black" stroke-width="1.0" fill="white" cx="55.0" cy="10.0" rx="7.0" ry="7.0" /><polyline stroke="black" stroke-width="1.0" fill="none" points="55.0,17 55.0,33" /><polyline stroke="black" stroke-width="1.0" fill="none" points="45.0,22 65.0,22" /><polyline stroke="black" stroke-width="1.0" fill="none" points="55.0,33 46.0,43" /><polyline stroke="black" stroke-width="1.0" fill="none" points="55.0,33 64.0,43" /><text x="55.0" y="52.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="55.0" dy="0">Người dùng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="117.0" y="5" width="96" height="42" /><text x="165.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="165.0" dy="0">Khung hội thoại</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="227.0" y="5" width="96" height="42" /><text x="275.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="275.0" dy="0">Xử lý phản hồi</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="337.0" y="5" width="96" height="42" /><text x="385.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="385.0" dy="0">Cơ sở dữ liệu</tspan></text></svg>