.0" fill="none" points="61.0,131 159.0,131" marker-end="url(#filled)" /><rect x="176.0" y="132" width="88.0" height="48" fill="white" /><text x="220.0" y="144.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="220.0" dy="0">2. Gửi nội</tspan><tspan x="220.0" dy="16">dung phản</tspan><tspan x="220.0" dy="16">hồi</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="171.0,181 269.0,181" marker-end="url(#filled)" /><rect x="283.0" y="182" width="136" height="48" fill="white" /><text x="288.0" y="194.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="288.0" dy="0">3. Kiểm tra phản hồi</tspan><tspan x="288.0" dy="16">và trạng thái đăng</tspan><tspan x="288.0" dy="16">nhập</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="281.0,231 311.0,231 311.0,245 282.0,245" marker-end="url(#filled)" /><rect x="286.0" y="232" width="88.0" height="64" fill="white" /><text x="330.0" y="244.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="330.0" dy="0">4. Lưu phản</tspan><tspan x="330.0" dy="16">hồi của tài</tspan><tspan x="330.0" dy="16">khoản nếu đủ</tspan><tspan x="330.0" dy="16">điều kiện</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="281.0,297 379.0,297" marker-end="url(#filled)" /><rect x="286.0" y="298" width="88.0" height="48" fill="white" /><text x="330.0" y="310.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="330.0" dy="0">5. Cập nhật</tspan><tspan x="330.0" dy="16">sự kiện và hồ</tspan><tspan x="330.0" dy="16">sơ sở thích</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="281.0,347 379.0,347" marker-end="url(#filled)" /><rect x="176.0" y="348" width="88.0" height="64" fill="white" /><text x="220.0" y="360.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="220.0" dy="0">6. Xác nhận</tspan><tspan x="220.0" dy="16">phản hồi có</tspan><tspan x="220.0" dy="16">được lưu hay</tspan><tspan x="220.0" dy="16">không</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="269.0,413 171.0,413" marker-end="url(#open)" /><rect x="66.0" y="414" width="88.0" height="48" fill="white" /><text x="110.0" y="426.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="110.0" dy="0">7. Hiển thị</tspan><tspan x="110.0" dy="16">thông báo ghi</tspan><tspan x="110.0" dy="16">nhận</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="159.0,463 61.0,463" marker-end="url(#open)" /><ellipse stroke="black" stroke-width="1.0" fill="white" cx="55.0" cy="10.0" rx="7.0" ry="7.0" /><polyline stroke="black" stroke-width="1.0" fill="none" points="55.0,17 55.0,33" /><polyline stroke="black" stroke-width="1.0" fill="none" points="45.0,22 65.0,22" /><polyline stroke="black" stroke-width="1.0" fill="none" points="55.0,33 46.0,43" /><polyline stroke="black" stroke-width="1.0" fill="none" points="55.0,33 64.0,43" /><text x="55.0" y="47.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="55.0" dy="0">Người dùng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="117.0" y="5" width="96" height="42" /><text x="165.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="165.0" dy="0">Khung hội thoại</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="227.0" y="5" width="96" height="42" /><text x="275.0" y="3