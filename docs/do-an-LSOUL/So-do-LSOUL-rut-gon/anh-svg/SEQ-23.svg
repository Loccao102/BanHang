<svg xmlns="http://www.w3.org/2000/svg" width="440" height="290" viewBox="0 0 440 290"><title>Chốt đơn trong hội thoại</title><rect width="100%" height="100%" fill="white" /><defs><marker id="filled" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black" stroke="black" stroke-width=".75" /></marker><marker id="open" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="black" stroke-width=".75" /></marker><marker id="triangle" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="white" stroke="black" stroke-width=".75" /></marker></defs><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="50.0,48 50.0,284" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="163.33333333333331,48 163.33333333333331,284" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="276.66666666666663,48 276.66666666666663,284" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="390.0,48 390.0,284" /><rect x="16" y="65" width="408" height="16" fill="white" /><text x="21" y="77.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">1. Chọn đặt hàng từ gợi ý hội thoại</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="160.33333333333331" y="80" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="53.0,83 160.33333333333331,83" marker-end="url(#filled)" /><rect x="16" y="86" width="408" height="16" fill="white" /><text x="21" y="98.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">2. Thu thập sản phẩm, cỡ và địa chỉ</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" points="166.33333333333331,104 193.33333333333331,104 193.33333333333331,114 166.33333333333331,114" marker-end="url(#filled)" /><rect x="16" y="119" width="408" height="16" fill="white" /><text x="21" y="131.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">3. Gửi yêu cầu đặt hàng</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="273.66666666666663" y="134" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="166.33333333333331,137 273.66666666666663,137" marker-end="url(#filled)" /><rect x="16" y="140" width="408" height="16" fill="white" /><text x="21" y="152.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">4. Kiểm tra đăng nhập và dữ liệu đơn</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" points="279.66666666666663,158 306.66666666666663,158 306.66666666666663,168 279.66666666666663,168" marker-end="url(#filled)" /><rect x="16" y="173" width="408" height="16" fill="white" /><text x="21" y="185.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">5. Đọc lại giá, tồn kho và ưu đãi</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="387.0" y="188" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="279.66666666666663,191 387.0,191" marker-end="url(#filled)" /><rect x="16" y="194" width="408" height="16" fill="white" /><text x="21" y="206.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">6. Tạo đơn và trừ tồn trong giao dịch</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="387.0" y="209" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="279.66666666666663,212 387.0,212" marker-end="url(#filled)" /><rect x="16" y="215" width="408" height="16" fill="white" /><text x="21" y="227.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">7. Xóa giỏ theo cách đặt hàng hiện tại</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="387.0" y="230" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="279.66666666666663,233 387.0,233" marker-end="url(#filled)" /><rect x="16" y="236" width="408" height="16" fill="white" /><text x="21" y="248.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">8. Trả đơn hoặc lý do từ chối</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="160.33333333333331" y="251" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="273.66666666666663,254 166.33333333333331,254" marker-end="url(#open)" /><rect x="16" y="257" width="408" height="16" fill="white" /><text x="21" y="269.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">9. Hiển thị đơn và hướng dẫn thanh toán</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="47.0" y="272" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="160.33333333333331,275 53.0,275" marker-end="url(#open)" /><rect stroke="black" stroke-width=".75" fill="white" x="6.0" y="7" width="88" height="42" /><text x="50.0" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" dy="0">Người dùng</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="119.33333333333331" y="7" width="88" height="42" /><text x="163.33333333333331" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="163.33333333333331" dy="0">Giao diện</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="232.66666666666663" y="7" width="88" height="42" /><text x="276.66666666666663" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="276.66666666666663" dy="0">Xử lý</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="346.0" y="7" width="88" height="42" /><text x="390.0" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="390.0" dy="0">Dữ liệu</tspan></text></svg>