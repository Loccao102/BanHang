<svg xmlns="http://www.w3.org/2000/svg" width="440" height="319" viewBox="0 0 440 319"><title>Chốt đơn trong hội thoại</title><rect width="100%" height="100%" fill="white" /><defs><marker id="filled" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black" stroke="black" stroke-width="1.0" /></marker><marker id="open" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="black" stroke-width="1.0" /></marker><marker id="triangle" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="white" stroke="black" stroke-width="1.0" /></marker></defs><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="55.0,55 55.0,311" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="165.0,55 165.0,311" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="275.0,55 275.0,311" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="385.0,55 385.0,311" /><rect stroke="black" stroke-width="1.0" fill="white" x="271.0" y="143" width="8" height="140" /><rect stroke="black" stroke-width="1.0" fill="white" x="161.0" y="89" width="8" height="221" /><rect stroke="black" stroke-width="1.0" fill="white" x="381.0" y="197" width="8" height="112" /><rect x="18" y="68" width="404" height="18" fill="white" /><text x="23" y="81.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">1. Chọn đặt hàng từ gợi ý hội thoại</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="59.0,90 161.0,90" marker-end="url(#filled)" /><rect x="18" y="95" width="404" height="18" fill="white" /><text x="23" y="108.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">2. Thu thập sản phẩm, cỡ và địa chỉ</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="169.0,117 199.0,117 199.0,129 170.0,129" marker-end="url(#filled)" /><rect x="18" y="122" width="404" height="18" fill="white" /><text x="23" y="135.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">3. Gửi yêu cầu đặt hàng</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="169.0,144 271.0,144" marker-end="url(#filled)" /><rect x="18" y="149" width="404" height="18" fill="white" /><text x="23" y="162.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">4. Kiểm tra đăng nhập và dữ liệu đơn</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="279.0,171 309.0,171 309.0,183 280.0,183" marker-end="url(#filled)" /><rect x="18" y="176" width="404" height="18" fill="white" /><text x="23" y="189.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">5. Đọc lại giá, tồn kho và ưu đãi</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="279.0,198 381.0,198" marker-end="url(#filled)" /><rect x="18" y="203" width="404" height="18" fill="white" /><text x="23" y="216.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">6. Tạo đơn và trừ tồn trong giao dịch</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="279.0,225 381.0,225" marker-end="url(#filled)" /><rect x="18" y="230" width="404" height="18" fill="white" /><text x="23" y="243.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">7. Xóa giỏ theo cách đặt hàng hiện tại</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="279.0,252 381.0,252" marker-end="url(#filled)" /><rect x="18" y="257" width="404" height="18" fill="white" /><text x="23" y="270.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">8. Trả đơn hoặc lý do từ chối</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="271.0,279 169.0,279" marker-end="url(#open)" /><rect x="18" y="284" width="404" height="18" fill="white" /><text x="23" y="297.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">9. Hiển thị đơn và hướng dẫn thanh toán</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="161.0,306 59.0,306" marker-end="url(#open)" /><ellipse stroke="black" stroke-width="1.0" fill="white" cx="55.0" cy="10.0" rx="7.0" ry="7.0" /><polyline stroke="black" stroke-width="1.0" fill="none" points="55.0,17 55.0,33" /><polyline stroke="black" stroke-width="1.0" fill="none" points="45.0,22 65.0,22" /><polyline stroke="black" stroke-width="1.0" fill="none" points="55.0,33 46.0,43" /><polyline stroke="black" stroke-width="1.0" fill="none" points="55.0,33 64.0,43" /><text x="55.0" y="52.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="55.0" dy="0">Người dùng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="117.0" y="5" width="96" height="42" /><text x="165.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="165.0" dy="0">Khung hội thoại</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="227.0" y="5" width="96" height="42" /><text x="275.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="275.0" dy="0">Xử lý đặt hàng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="337.0" y="5" width="96" height="42" /><text x="385.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="385.0" dy="0">Cơ sở dữ liệu</tspan></text></svg>