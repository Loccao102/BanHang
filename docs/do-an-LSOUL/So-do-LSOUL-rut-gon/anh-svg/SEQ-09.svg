<svg xmlns="http://www.w3.org/2000/svg" width="700" height="373" viewBox="0 0 700 373"><title>Giỏ hàng và mã giảm giá</title><rect width="100%" height="100%" fill="white" /><defs><marker id="filled" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black" stroke="black" stroke-width="1.0" /></marker><marker id="open" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="black" stroke-width="1.0" /></marker><marker id="triangle" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="white" stroke="black" stroke-width="1.0" /></marker></defs><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="52.0,55 52.0,365" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="250.66666666666666,55 250.66666666666666,365" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="449.3333333333333,55 449.3333333333333,365" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="648.0,55 648.0,365" /><rect stroke="black" stroke-width="1.0" fill="white" x="445.3333333333333" y="143" width="8" height="194" /><rect stroke="black" stroke-width="1.0" fill="white" x="246.66666666666666" y="89" width="8" height="275" /><rect stroke="black" stroke-width="1.0" fill="white" x="644.0" y="170" width="8" height="193" /><rect x="18" y="68" width="664" height="18" fill="white" /><text x="23" y="81.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">1. Chọn sản phẩm, cỡ và số lượng</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="56.0,90 246.66666666666666,90