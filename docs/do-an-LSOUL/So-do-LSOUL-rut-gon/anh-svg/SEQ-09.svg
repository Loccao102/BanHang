polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="246.66666666666666,360 56.0,360" marker-end="url(#open)" /><ellipse stroke="black" stroke-width="1.0" fill="white" cx="52.0" cy="10.0" rx="7.0" ry="7.0" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,17 52.0,33" /><polyline stroke="black" stroke-width="1.0" fill="none" points="42.0,22 62.0,22" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 43.0,43" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 61.0,43" /><text x="52.0" y="52.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="52.0" dy="0">Người dùng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="202.66666666666666" y="5" width="96" height="42" /><text x="250.66666666666666" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="250.66666666666666" dy="0">Form giỏ hàng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="401.3333333333333" y="5" width="96" height="42" /><text x="449.3333333333333" y="22.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="449.3333333333333" dy="0">Xử lý giỏ và ưu</tspan><tspan x="449.3333333333333" dy="16">đãi</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="600.0" y="5" width="96" height="42" /><text x="648.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="648.0" dy="0">Cơ sở dữ liệu</tspan></text></svg>