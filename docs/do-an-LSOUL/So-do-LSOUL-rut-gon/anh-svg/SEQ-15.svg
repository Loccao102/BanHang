ke="black" stroke-width=".75" fill="white" x="160.33333333333331" y="293" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="273.66666666666663,296 166.33333333333331,296" marker-end="url(#open)" /><rect x="16" y="299" width="408" height="16" fill="white" /><text x="21" y="311.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">11. Làm mới thông tin</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="47.0" y="314" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="160.33333333333331,317 53.0,317" marker-end="url(#open)" /><rect stroke="black" stroke-width=".75" fill="white" x="6.0" y="7" width="88" height="42" /><text x="50.0" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" dy="0">Quản trị viên</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="119.33333333333331" y="7" width="88" height="42" /><text x="163.33333333333331" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="163.33333333333331" dy="0">Giao diện</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="232.66666666666663" y="7" width="88" height="42" /><text x="276.66666666666663" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="276.66666666666663" dy="0">Xử lý</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="346.0" y="7" width="88" height="42" /><text x="390.0" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="390.0" dy="0">Dữ liệu</tspan></text></svg>