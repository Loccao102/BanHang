<tspan x="21" dy="0">6. Yêu cầu kiểm tra ưu đãi hoặc đồng bộ giỏ</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="273.66666666666663" y="209" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="166.33333333333331,212 273.66666666666663,212" marker-end="url(#filled)" /><rect x="16" y="215" width="408" height="16" fill="white" /><text x="21" y="227.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">7. Đọc ưu đãi hoặc lưu giỏ theo tài khoản</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="387.0" y="230" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="279.66666666666663,233 387.0,233" marker-end="url(#filled)" /><rect x="16" y="236" width="408" height="16" fill="white" /><text x="21" y="248.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">8. Trả kết quả xử lý</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="160.33333333333331" y="251" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="273.66666666666663,254 166.33333333333331,254" marker-end="url(#open)" /><rect x="16" y="257" width="408" height="16" fill="white" /><text x="21" y="269.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">9. Hiển thị kết quả thao tác</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="47.0" y="272" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="160.33333333333331,275 53.0,275" marker-end="url(#open)" /><rect stroke="black" stroke-width=".75" fill="white" x="6.0" y="7" width="88" height="42" /><text x="50.0" y="32.0" text-anchor="middle" font-fami