<svg xmlns="http://www.w3.org/2000/svg" width="700" height="373" viewBox="0 0 700 373"><title>Mua ngay và thanh toán lại đơn QR</title><rect width="100%" height="100%" fill="white" /><defs><marker id="filled" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black" stroke="black" stroke-width="1.0" /></marker><marker id="open" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="black" stroke-width="1.0" /></marker><marker id="triangle" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="white" stroke="black" stroke-width="1.0" /></marker></defs><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="52.0,55 52.0,365" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="250.66666666666666,55 250.66666666666666,365" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="449.3333333333333,55 449.3333333333333,365" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="648.0,55 648.0,365" /><rect stroke="black" stroke-width="1.0" fill="white" x="445.3333333333333" y="116" width="8" height="140" /><rect stroke="black" stroke-width="1.0" fill="white" x="246.66666666666666" y="89" width="8" height="194" /><rect stroke="black" stroke-width="1.0" fill="white" x="445.3333333333333" y="305" width="8" height="59" /><rect stroke="black" stroke-width="1.0" fill="white" x="644.0" y="170" width="8" height="193" /><rect x="18" y="68" width="664" height="18" fill="white" /><text x="23" y="81.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">1. Chọn Mua ngay hoặc mở đơn QR đang chờ</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="56.0,90 246.66666666666666,90" marker-end="url(#filled)" /><rect x="18" y="95" width="664" height="18" fill="white" /><text x="23" y="108.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">2. Yêu cầu xử lý theo lựa chọn</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="254.66666666666666,117 445.3333333333333,117" marker-end="url(#filled)" /><rect x="18" y="122" width="664" height="18" fill="white" /><text x="23" y="135.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">3. Kiểm tra đăng nhập và chủ đơn</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="453.3333333333333,144 483.3333333333333,144 483.3333333333333,156 454.3333333333333,156" marker-end="url(#filled)" /><rect x="18" y="149" width="664" height="18" fill="white" /><text x="23" y="162.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">4. Đọc sản phẩm hoặc đơn đã chọn</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="453.3333333333333,171 644.0,171" marker-end="url(#filled)" /><rect x="18" y="176" width="664" height="18" fill="white" /><text x="23" y="189.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">5. Tạo đơn Mua ngay nếu chưa có đơn</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="453.3333333333333,198 644.0,198" marker-end="url(#filled)" /><rect x="18" y="203" width="664" height="18" fill="white" /><text x="23" y="216.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">6. Giữ giỏ đã lưu khi Mua ngay</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="453.3333333333333,225 483.3333333333333,225 483.3333333333333,237 454.3333333333333,237" marker-end="url(#filled)" /><rect x="18" y="230" width="664" height="18" fill="white" /><text x="23" y="243.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">7. Trả thông tin đơn và cách thanh toán</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="445.3333333333333,252 254.66666666666666,252" marker-end="url(#open)" /><rect x="18" y="257" width="664" height="18" fill="white" /><text x="23" y="270.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">8. Hiển thị đơn hoặc mã QR</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="246.66666666666666,279 56.0,279" marker-end="url(#open)" /><rect x="18" y="284" width="664" height="18" fill="white" /><text x="23" y="297.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">9. Lấy trạng thái thanh toán mới</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="254.66666666666666,306 445.3333333333333,306" marker-end="url(#filled)" /><rect x="18" y="311" width="664" height="18" fill="white" /><text x="23" y="324.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">10. Đọc kết quả thanh toán</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="453.3333333333333,333 644.0,333" marker-end="url(#filled)" /><rect x="18" y="338" width="664" height="18" fill="white" /><text x="23" y="351.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">11. Trả trạng thái hiện tại</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="445.3333333333333,360 254.66666666666666,360" marker-end="url(#open)" /><ellipse stroke="black" stroke-width="1.0" fill="white" cx="52.0" cy="10.0" rx="7.0" ry="7.0" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,17 52.0,33" /><polyline stroke="black" stroke-width="1.0" fill="none" points="42.0,22 62.0,22" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 43.0,43" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 61.0,43" /><text x="52.0" y="52.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="52.0" dy="0">Khách hàng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="202.66666666666666" y="5" width="96" height="42" /><text x="250.66666666666666" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="250.66666666666666" dy="0">Form đặt hàng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="401.3333333333333" y="5" width="96" height="42" /><text x="449.3333333333333" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="449.3333333333333" dy="0">Xử lý đặt hàng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="600.0" y="5" width="96" height="42" /><text x="648.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="648.0" dy="0">Cơ sở dữ liệu</tspan></text></svg>