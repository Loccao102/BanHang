<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"><title>Đánh giá trang phục và phản hồi</title><rect width="100%" height="100%" fill="white" /><defs><marker id="filled" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black" stroke="black" stroke-width="1.0" /></marker><marker id="open" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="black" stroke-width="1.0" /></marker><marker id="triangle" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="white" stroke="black" stroke-width="1.0" /></marker></defs><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="52.0,55 52.0,392" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="201.0,55 201.0,392" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="350.0,55 350.0,392" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="499.0,55 499.0,392" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="648.0,55 648.0,392" /><rect stroke="black" stroke-width="1.0" fill="white" x="495.0" y="170" width="8" height="32" /><rect stroke="black" stroke-width="1.0" fill="white" x="346.0" y="116" width="8" height="167" /><rect stroke="black" stroke-width="1.0" fill="white" x="346.0" y="332" width="8" height="59" /><rect stroke="black" stroke-width="1.0" fill="white" x="197.0" y="89" width="8" height="301" /><rect stroke="black" stroke-width="1.0" fill="white" x="644.0" y="143" width="8" height="247" /><rect x="18" y="68" width="664" height="18" fill="white" /><text x="23" y="81.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">1. Chọn đánh giá bộ trang phục</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="56.0,90 197.0,90" marker-end="url(#filled)" /><rect x="18" y="95" width="664" height="18" fill="white" /><text x="23" y="108.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">2. Gửi ảnh và danh sách sản phẩm</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="205.0,117 346.0,117" marker-end="url(#filled)" /><rect x="18" y="122" width="664" height="18" fill="white" /><text x="23" y="135.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">3. Đọc sở thích của tài khoản nếu có</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,144 644.0,144" marker-end="url(#filled)" /><rect x="18" y="149" width="664" height="18" fill="white" /><text x="23" y="162.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">4. Yêu cầu phân tích ảnh và bộ phối</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,171 495.0,171" marker-end="url(#filled)" /><rect x="18" y="176" width="664" height="18" fill="white" /><text x="23" y="189.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">5. Trả điểm, nhận xét hoặc lỗi</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="495.0,198 354.0,198" marker-end="url(#open)" /><rect x="18" y="203" width="664" height="18" fill="white" /><text x="23" y="216.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">6. Dùng quy tắc dự phòng nếu cần</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,225 384.0,225 384.0,237 355.0,237" marker-end="url(#filled)" /><rect x="18" y="230" width="664" height="18" fill="white" /><text x="23" y="243.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">7. Lưu đánh giá nếu có phiên thử đồ</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,252 644.0,252" marker-end="url(#filled)" /><rect x="18" y="257" width="664" height="18" fill="white" /><text x="23" y="270.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">8. Trả điểm và nhận xét</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="346.0,279 205.0,279" marker-end="url(#open)" /><rect x="18" y="284" width="664" height="18" fill="white" /><text x="23" y="297.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">9. Gửi phản hồi về đánh giá</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="56.0,306 197.0,306" marker-end="url(#filled)" /><rect x="18" y="311" width="664" height="18" fill="white" /><text x="23" y="324.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">10. Chuyển nội dung phản hồi</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="205.0,333 346.0,333" marker-end="url(#filled)" /><rect x="18" y="338" width="664" height="18" fill="white" /><text x="23" y="351.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">11. Lưu phản hồi và cập nhật sở thích</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="354.0,360 644.0,360" marker-end="url(#filled)" /><rect x="18" y="365" width="664" height="18" fill="white" /><text x="23" y="378.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">12. Xác nhận kết quả ghi nhận</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="346.0,387 205.0,387" marker-end="url(#open)" /><ellipse stroke="black" stroke-width="1.0" fill="white" cx="52.0" cy="10.0" rx="7.0" ry="7.0" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,17 52.0,33" /><polyline stroke="black" stroke-width="1.0" fill="none" points="42.0,22 62.0,22" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 43.0,43" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 61.0,43" /><text x="52.0" y="52.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="52.0" dy="0">Người dùng</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="153.0" y="5" width="96" height="42" /><text x="201.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="201.0" dy="0">Phòng thử đồ</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="302.0" y="5" width="96" height="42" /><text x="350.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="350.0" dy="0">Xử lý đánh giá</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="451.0" y="5" width="96" height="42" /><text x="499.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="499.0" dy="0">AI Stylist</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="600.0" y="5" width="96" height="42" /><text x="648.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="648.0" dy="0">Cơ sở dữ liệu</tspan></text></svg>