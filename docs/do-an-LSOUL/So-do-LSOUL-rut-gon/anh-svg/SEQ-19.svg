<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="373" viewBox="0 0 700 373"><title>Quản lý sản phẩm và tồn kho</title><rect width="100%" height="100%" fill="white" /><defs><marker id="filled" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="black" stroke="black" stroke-width="1.0" /></marker><marker id="open" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="black" stroke-width="1.0" /></marker><marker id="triangle" viewBox="0 0 9 9" refX="8" refY="4" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="white" stroke="black" stroke-width="1.0" /></marker></defs><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="52.0,55 52.0,365" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="250.66666666666666,55 250.66666666666666,365" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="449.3333333333333,55 449.3333333333333,365" /><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="648.0,55 648.0,365" /><rect stroke="black" stroke-width="1.0" fill="white" x="445.3333333333333" y="116" width="8" height="59" /><rect stroke="black" stroke-width="1.0" fill="white" x="644.0" y="143" width="8" height="167" /><rect stroke="black" stroke-width="1.0" fill="white" x="445.3333333333333" y="224" width="8" height="113" /><rect stroke="black" stroke-width="1.0" fill="white" x="246.66666666666666" y="89" width="8" height="275" /><rect x="18" y="68" width="664" height="18" fill="white" /><text x="23" y="81.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">1. Mở trang sản phẩm quản trị</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="56.0,90 246.66666666666666,90" marker-end="url(#filled)" /><rect x="18" y="95" width="664" height="18" fill="white" /><text x="23" y="108.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">2. Yêu cầu danh sách sản phẩm</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="254.66666666666666,117 445.3333333333333,117" marker-end="url(#filled)" /><rect x="18" y="122" width="664" height="18" fill="white" /><text x="23" y="135.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">3. Đọc sản phẩm và biến thể</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="453.3333333333333,144 644.0,144" marker-end="url(#filled)" /><rect x="18" y="149" width="664" height="18" fill="white" /><text x="23" y="162.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">4. Trả danh sách</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="445.3333333333333,171 254.66666666666666,171" marker-end="url(#open)" /><rect x="18" y="176" width="664" height="18" fill="white" /><text x="23" y="189.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">5. Nhập thông tin thêm, sửa hoặc số tồn</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="56.0,198 246.66666666666666,198" marker-end="url(#filled)" /><rect x="18" y="203" width="664" height="18" fill="white" /><text x="23" y="216.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">6. Gửi dữ liệu thay đổi</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="254.66666666666666,225 445.3333333333333,225" marker-end="url(#filled)" /><rect x="18" y="230" width="664" height="18" fill="white" /><text x="23" y="243.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">7. Kiểm tra quyền, mã, giá, cỡ và số lượng</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="453.3333333333333,252 483.3333333333333,252 483.3333333333333,264 454.3333333333333,264" marker-end="url(#filled)" /><rect x="18" y="257" width="664" height="18" fill="white" /><text x="23" y="270.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">8. Cập nhật sản phẩm và tồn trong giao dịch</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" points="453.3333333333333,279 644.0,279" marker-end="url(#filled)" /><rect x="18" y="284" width="664" height="18" fill="white" /><text x="23" y="297.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">9. Lưu thành công hoặc hủy giao dịch lỗi</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="644.0,306 453.3333333333333,306" marker-end="url(#open)" /><rect x="18" y="311" width="664" height="18" fill="white" /><text x="23" y="324.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">10. Trả kết quả và số tồn mới</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="445.3333333333333,333 254.66666666666666,333" marker-end="url(#open)" /><rect x="18" y="338" width="664" height="18" fill="white" /><text x="23" y="351.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="23" dy="0">11. Hiển thị thông tin cập nhật</tspan></text><polyline stroke="black" stroke-width="1.0" fill="none" stroke-dasharray="4 3" points="246.66666666666666,360 56.0,360" marker-end="url(#open)" /><ellipse stroke="black" stroke-width="1.0" fill="white" cx="52.0" cy="10.0" rx="7.0" ry="7.0" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,17 52.0,33" /><polyline stroke="black" stroke-width="1.0" fill="none" points="42.0,22 62.0,22" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 43.0,43" /><polyline stroke="black" stroke-width="1.0" fill="none" points="52.0,33 61.0,43" /><text x="52.0" y="52.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="52.0" dy="0">Quản trị viên</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="202.66666666666666" y="5" width="96" height="42" /><text x="250.66666666666666" y="22.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="250.66666666666666" dy="0">Quản lý sản</tspan><tspan x="250.66666666666666" dy="16">phẩm</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="401.3333333333333" y="5" width="96" height="42" /><text x="449.3333333333333" y="22.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="449.3333333333333" dy="0">Xử lý sản phẩm</tspan><tspan x="449.3333333333333" dy="16">và tồn</tspan></text><rect stroke="black" stroke-width="1.0" fill="white" x="600.0" y="5" width="96" height="42" /><text x="648.0" y="30.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="648.0" dy="0">Cơ sở dữ liệu</tspan></text></svg>