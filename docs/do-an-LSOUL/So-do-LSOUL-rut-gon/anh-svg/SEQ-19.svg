tyle="normal" fill="black"><tspan x="21" dy="0">2. Yêu cầu danh sách sản phẩm</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="273.66666666666663" y="101" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="166.33333333333331,104 273.66666666666663,104" marker-end="url(#filled)" /><rect x="16" y="107" width="408" height="16" fill="white" /><text x="21" y="119.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">3. Đọc sản phẩm và biến thể</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="387.0" y="122" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="279.66666666666663,125 387.0,125" marker-end="url(#filled)" /><rect x="16" y="128" width="408" height="16" fill="white" /><text x="21" y="140.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">4. Trả danh sách</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="160.33333333333331" y="143" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="273.66666666666663,146 166.33333333333331,146" marker-end="url(#open)" /><rect x="16" y="149" width="408" height="16" fill="white" /><text x="21" y="161.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">5. Nhập thông tin thêm, sửa hoặc số tồn</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="160.33333333333331" y="164" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="53.0,167 160.33333333333331,167" marker-end="url(#filled)" /><rect x="16" y="170" width="408" height="16" fill="white" /><text x="21" y="182.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">6. Gửi dữ liệu thay đổi</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="273.66666666666663" y="185" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="166.33333333333331,188 273.66666666666663,188" marker-end="url(#filled)" /><rect x="16" y="191" width="408" height="16" fill="white" /><text x="21" y="203.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">7. Kiểm tra quyền, mã, giá, cỡ và số lượng</tspan></text><polyline stroke="black" stroke-width=".75" fill="none" points="279.66666666666663,209 306.66666666666663,209 306.66666666666663,219 279.66666666666663,219" marker-end="url(#filled)" /><rect x="16" y="224" width="408" height="16" fill="white" /><text x="21" y="236.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">8. Cập nhật sản phẩm và tồn trong giao dịch</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="387.0" y="239" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" points="279.66666666666663,242 387.0,242" marker-end="url(#filled)" /><rect x="16" y="245" width="408" height="16" fill="white" /><text x="21" y="257.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">9. Lưu thành công hoặc hủy giao dịch lỗi</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="273.66666666666663" y="260" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="387.0,263 279.66666666666663,263" marker-end="url(#open)" /><rect x="16" y="266" width="408" height="16" fill="white" /><text x="21" y="278.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">10. Trả kết quả và số tồn mới</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="160.33333333333331" y="281" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="273.66666666666663,284 166.33333333333331,284" marker-end="url(#open)" /><rect x="16" y="287" width="408" height="16" fill="white" /><text x="21" y="299.0" text-anchor="start" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="21" dy="0">11. Hiển thị thông tin cập nhật</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="47.0" y="302" width="6" height="9" /><polyline stroke="black" stroke-width=".75" fill="none" stroke-dasharray="4 3" points="160.33333333333331,305 53.0,305" marker-end="url(#open)" /><rect stroke="black" stroke-width=".75" fill="white" x="6.0" y="7" width="88" height="42" /><text x="50.0" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="50.0" dy="0">Quản trị viên</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="119.33333333333331" y="7" width="88" height="42" /><text x="163.33333333333331" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="163.33333333333331" dy="0">Giao diện</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="232.66666666666663" y="7" width="88" height="42" /><text x="276.66666666666663" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="276.66666666666663" dy="0">Xử lý</tspan></text><rect stroke="black" stroke-width=".75" fill="white" x="346.0" y="7" width="88" height="42" /><text x="390.0" y="32.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="390.0" dy="0">Dữ liệu</tspan></text></svg>