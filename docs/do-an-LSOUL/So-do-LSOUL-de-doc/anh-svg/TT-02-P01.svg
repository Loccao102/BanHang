=".75" fill="white" cx="220.0" cy="484.0" rx="12.0" ry="12.0" /><ellipse stroke="black" stroke-width=".75" fill="black" cx="220.0" cy="484.0" rx="9.0" ry="9.0" /><polyline stroke="black" stroke-width=".75" fill="none" points="220,33 110,33 110,130" marker-end="url(#filled)" /><polyline stroke="black" stroke-width=".75" fill="none" points="220,33 330,33 330,130" marker-end="url(#filled)" /><polyline stroke="black" stroke-width=".75" fill="none" points="110,192 110,330 180,330 180,360" marker-end="url(#filled)" /><polyline stroke="black" stroke-width=".75" fill="none" points="330,192 330,330 260,330 260,360" marker-end="url(#filled)" /><polyline stroke="black" stroke-width=".75" fill="none" points="220,422 220,475" marker-end="url(#filled)" /><rect x="15" y="75" width="85" height="24" fill="white" /><text x="57.5" y="91.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="57.5" dy="0">Đơn QR</tspan></text><rect x="340" y="75" width="90" height="24" fill="white" /><text x="385.0" y="91.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="385.0" dy="0">Đơn COD</tspan></text><rect x="120" y="228" width="98" height="76" fill="white" /><text x="169.0" y="262.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="169.0" dy="0">Chữ ký, mã và</tspan><tspan x="169.0" dy="16">tiền khớp</tspan></text><rect x="222" y="228" width="98" height="76" fill="white" /><text x="271.0" y="262.0" text-anchor="middle" font-family="Times New Roman" font-size="13" font-weight="normal" font-style="normal" fill="black"><tspan x="271.0" dy="0">Thu COD khi</tspan><tspan x="271.0" dy="16">đơn hoàn tất</tspan></text><rect x="8" y="510" width="424" height="44" fill="white" /><text x="220.0" y="528.0" text-anchor="middle" font-family="Times New Roman" font-size="13" f